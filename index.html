<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日工作记录</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .date { color: #86868b; font-size: 14px; margin-bottom: 20px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type=text] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #d2d2d7;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
  }
  input[type=text]:focus { border-color: #007aff; }
  button {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #007aff;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
  }
  button:active { opacity: 0.7; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    background: #fff;
    padding: 14px;
    margin-bottom: 8px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  li.done .title { text-decoration: line-through; color: #86868b; }
  .title { flex: 1; word-break: break-word; }
  input[type=checkbox] { width: 20px; height: 20px; cursor: pointer; }
  .del {
    background: none;
    color: #ff3b30;
    font-size: 20px;
    padding: 4px 10px;
  }
  .stats {
    margin-top: 20px;
    color: #86868b;
    font-size: 14px;
    text-align: center;
  }
  .empty { color: #86868b; text-align: center; padding: 30px 0; }
</style>
</head>
<body>
  <h1>今天</h1>
  <div class="date" id="dateLabel"></div>

  <div class="input-row">
    <input type="text" id="taskInput" placeholder="输入任务，回车添加">
    <button onclick="addTask()">添加</button>
  </div>

  <ul id="taskList"></ul>
  <p class="stats" id="stats"></p>

<script>
const SUPABASE_URL = 'https://qsthbkcaoxcuteukofkh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CTx79nJHIFo4KFJZA3p0YQ_Q8nLYeux';

const API = SUPABASE_URL + '/rest/v1/tasks';
const HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};

const today = new Date().toISOString().slice(0, 10);
document.getElementById('dateLabel').textContent = today;

async function load() {
  const res = await fetch(
    `${API}?date=eq.${today}&order=created_at`,
    { headers: HEADERS }
  );
  const tasks = await res.json();
  render(tasks);
}

function render(tasks) {
  const list = document.getElementById('taskList');
  list.innerHTML = '';

  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty">今天还没有任务</div>';
    document.getElementById('stats').textContent = '';
    return;
  }

  tasks.forEach(t => {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    li.innerHTML = `
      <input type="checkbox" ${t.done ? 'checked' : ''}
             onchange="toggle(${t.id}, ${t.done})">
      <span class="title">${escapeHtml(t.title)}</span>
      <button class="del" onclick="del(${t.id})">×</button>`;
    list.appendChild(li);
  });

  const done = tasks.filter(t => t.done).length;
  document.getElementById('stats').textContent =
    `完成 ${done} / 共 ${tasks.length}，未完成 ${tasks.length - done}`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function addTask() {
  const input = document.getElementById('taskInput');
  const title = input.value.trim();
  if (!title) return;

  await fetch(API, {
    method: 'POST',
    headers: HEADERS,
    body: JSON.stringify({
      title: title,
      date: today,
      done: false,
      origin_date: today
    })
  });

  input.value = '';
  load();
}

async function toggle(id, done) {
  await fetch(`${API}?id=eq.${id}`, {
    method: 'PATCH',
    headers: HEADERS,
    body: JSON.stringify({
      done: !done,
      done_at: !done ? new Date().toISOString() : null
    })
  });
  load();
}

async function del(id) {
  await fetch(`${API}?id=eq.${id}`, {
    method: 'DELETE',
    headers: HEADERS
  });
  load();
}

document.getElementById('taskInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

load();
</script>
</body>
</html>
